[package]
name = "agent-vault"
version = "0.1.0"
description = "Agent Vault Pinocchio program on Solana"
edition = "2021"
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "agent_vault"

[features]
default = ["devnet"]
no-entrypoint = []
devnet = []
mainnet = []

[dependencies]
pinocchio = { version = "0.10", features = ["cpi"] }
pinocchio-log = { version = "0.5", default-features = false }
pinocchio-system = "0.5"
solana-sha256-hasher = { version = "3.1", features = ["sha2"] }

[lints]
workspace = true
